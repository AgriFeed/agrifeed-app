name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Provisions its own real Postgres, on the same port (5433) and with the
  # same agrifeed_test database name every indexer test file already
  # assumes by default (see e.g. services/indexer/src/poll.test.ts's
  # TEST_DATABASE_URL fallback) -- this is what was missing before: this
  # job ran `pnpm test` with no reachable database at all, so every real
  # Postgres-backed indexer test failed with ECONNREFUSED. The
  # `--health-cmd pg_isready` block matches indexer-migration's own
  # postgres service below; GitHub Actions blocks this job's steps from
  # starting until it reports healthy, so no arbitrary sleep is needed.
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agrifeed_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agrifeed/sdk build
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Verify indexer migrations apply cleanly to a fresh database
        run: pnpm --filter @agrifeed/indexer migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/agrifeed_test?sslmode=disable
      - run: pnpm test
        env:
          INDEXER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5433/agrifeed_test?sslmode=disable
      - run: pnpm build

  indexer-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agrifeed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agrifeed/sdk build
      - run: pnpm --filter @agrifeed/indexer migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/agrifeed?sslmode=disable

  research:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Execute the median backtest against the checked-in snapshots
        run: jupyter nbconvert --to notebook --execute --inplace notebooks/median_backtest.ipynb
